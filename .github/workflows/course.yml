name: Course files and email
on:
  workflow_dispatch:
    inputs:
      operation:
        description: First use mail-test, then run
        type: choice
        options: [mail-test, run]
        default: mail-test
      max_lectures:
        description: Maximum lectures for this run
        type: string
        default: '1'
  schedule:
    - cron: '23 12 * * *'
permissions:
  contents: write
concurrency:
  group: course-delivery
  cancel-in-progress: false
jobs:
  course:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_SCHEDULED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COURSE_ACCOUNT: ${{ secrets.COURSE_ACCOUNT }}
      COURSE_PASSWORD: ${{ secrets.COURSE_PASSWORD }}
      COURSE_FID: ${{ secrets.COURSE_FID }}
      COURSE_ENTRY_URL: ${{ secrets.COURSE_ENTRY_URL }}
      COURSE_REPLAY_URL: ${{ secrets.COURSE_REPLAY_URL }}
      COURSE_QUERY: ${{ secrets.COURSE_QUERY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_MAX_RAW_MB: ${{ vars.MAIL_MAX_RAW_MB || '18' }}
      DELIVERY: email
      MAX_LECTURES: ${{ inputs.max_lectures || vars.MAX_LECTURES || '3' }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - run: uv sync --locked
      - name: Restore delivery receipts
        if: inputs.operation != 'mail-test'
        uses: actions/cache/restore@v6.1.0
        with:
          path: local-data/state/delivery-state.enc
          key: course-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: course-receipts-
      - name: Check email only
        if: inputs.operation == 'mail-test'
        run: node src/run.mjs --mail-test
      - name: Install FFmpeg in the temporary runner
        if: inputs.operation != 'mail-test'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Fetch, process and send
        if: inputs.operation != 'mail-test'
        run: node src/run.mjs
      - name: Preserve successful delivery receipts
        if: always() && inputs.operation != 'mail-test' && hashFiles('local-data/state/delivery-state.enc') != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: local-data/state/delivery-state.enc
          key: course-receipts-${{ github.run_id }}-${{ github.run_attempt }}
